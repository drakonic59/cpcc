<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="index(title, path)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="container py-5">
<div th:replace="fragments/navbar :: navbar"></div>
<h1 class="mb-4" th:text="${title}">Management</h1>
<div>
    <a th:href="@{'/' + ${path} + '/list'}" class="btn btn-primary me-2" th:text="#{crud.viewList}">Voir la liste</a>
    <a th:href="@{'/' + ${path} + '/add'}" class="btn btn-success" th:text="#{crud.add}">Ajouter</a>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="list(items, fields, path, title)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="container py-5">
<div th:replace="fragments/navbar :: navbar"></div>
<h1 class="mb-4" th:text="${title}">List</h1>
<a th:href="@{'/' + ${path} + '/add'}" class="btn btn-success mb-3" th:text="#{crud.add}">Ajouter</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th th:each="field : ${fields}" th:text="${field}">Field</th>
        <th th:text="#{crud.actions}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:each="field : ${fields}" th:text="${#fields.field(item, field)}"></td>
        <td>
            <a th:href="@{'/' + ${path} + '/edit/' + ${#fields.field(item,'id')}}" class="btn btn-sm btn-secondary" th:text="#{crud.edit}">Modifier</a>
            <a th:href="@{'/' + ${path} + '/delete/' + ${#fields.field(item,'id')}}" class="btn btn-sm btn-danger" th:text="#{crud.delete}">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="form(item, fields, path, title)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="container py-5">
<div th:replace="fragments/navbar :: navbar"></div>
<h1 class="mb-4" th:text="${title}">Form</h1>
<form th:action="@{'/' + ${path} + '/save'}" th:object="${item}" method="post">
    <div class="mb-3" th:each="field : ${fields}">
        <label class="form-label" th:for="${field}" th:text="${field}"></label>
        <input class="form-control" th:field="*{__${field}__}" th:if="${field} != 'id'">
        <input type="hidden" th:field="*{__${field}__}" th:if="${field} == 'id'">
    </div>
    <button type="submit" class="btn btn-primary" th:text="#{crud.save}">Enregistrer</button>
    <a class="btn btn-secondary" th:href="@{'/' + ${path} + '/list'}" th:text="#{crud.cancel}">Annuler</a>
</form>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
