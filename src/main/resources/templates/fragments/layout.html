<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, page)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{dashboard.title}">Dashboard - Ramène ta truffe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    .sidebar {
      height: 100vh;
      background-color: #1e293b;
      color: white;
    }
    .sidebar .nav-link {
      color: #cbd5e1;
    }
    .sidebar .nav-link.active {
      background-color: #334155;
      color: white;
    }
    .card-icon {
      font-size: 1.5rem;
    }
    .dashboard-card {
      min-height: 160px;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar d-flex flex-column p-3">
      <h4 class="text-white mb-4" th:text="#{sidebar.brand}">Business Manager</h4>
      <ul class="nav nav-pills flex-column">
        <li class="nav-item"><a th:href="@{/}" th:classappend="${page}=='dashboard'?' active'" class="nav-link" th:text="#{sidebar.dashboard}">Dashboard</a></li>
        <li class="nav-item"><a th:href="@{/customers}" th:classappend="${page}=='customers'?' active'" class="nav-link" th:text="#{sidebar.clients}">Clients</a></li>
        <li class="nav-item"><a th:href="@{/products}" th:classappend="${page}=='products'?' active'" class="nav-link" th:text="#{sidebar.products}">Produits</a></li>
        <li class="nav-item"><a th:href="@{/orders}" th:classappend="${page}=='orders'?' active'" class="nav-link" th:text="#{sidebar.orders}">Commandes</a></li>
        <li class="nav-item"><a href="#" class="nav-link" th:text="#{sidebar.accounting}">Comptabilité</a></li>
        <li class="nav-item"><a href="#" class="nav-link" th:text="#{sidebar.settings}">Paramètres</a></li>
      </ul>
    </div>
    <!-- Main content -->
    <div class="col-md-10 p-4">
      <div th:replace="${content}"></div>
    </div>
  </div>
</div>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
